# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and Deploy IT Asset Manager

on:
  push:
    branches:
      - feature/github-actions

  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      ##################################################
      # Build React
      ##################################################

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm install

      - name: Build React Application
        working-directory: ./client
        run: npm run build

      ##################################################
      # Prepare Express
      ##################################################

      - name: Clean public folder
        run: |
          rm -rf server/public
          mkdir server/public

      - name: Copy React Build
        run: |
          cp -R client/dist/* server/public/

      ##################################################
      # Install Express Dependencies
      ##################################################

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm install

      ##################################################
      # Upload only server folder
      ##################################################

      - name: Upload Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-app
          path: server

  deploy:

    runs-on: ubuntu-latest

    needs: build

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Download Deployment Artifact
        uses: actions/download-artifact@v4
        with:
          name: server-app

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_32CDF9A24FB34507B71860F3A85E3D76 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_662718556A3A4175AD565C334F36FE57 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_19F1B7BFC9644823B62038F70BE16022 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: it-asset-manager-itmd504
          slot-name: Production
          package: .