name: Build and Deploy IT Asset Manager

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Install client dependencies
        working-directory: ./client
        run: npm install

      - name: Build React application
        working-directory: ./client
        run: npm run build

      - name: Copy React build to Express public folder
        run: |
          rm -rf server/public
          mkdir -p server/public
          cp -R client/dist/. server/public/

      - name: Install server dependencies
        working-directory: ./server
        run: npm install

      - name: Upload server deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-app
          path: server

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download server deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: server-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: it-asset-manager-itmd504
          slot-name: Production
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_6D07DF5F529E420DA11BEF4D99AFB8AE }}